<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Blue Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="calc" aria-label="Calculator">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="key acc" data-act="clear">AC</button>
    <button class="key acc" data-act="sign">+/−</button>
    <button class="key acc" data-act="percent">%</button>
    <button class="key op" data-op="/" aria-label="divide">÷</button>

    <button class="key" data-num="7">7</button>
    <button class="key" data-num="8">8</button>
    <button class="key" data-num="9">9</button>
    <button class="key op" data-op="*" aria-label="multiply">×</button>

    <button class="key" data-num="4">4</button>
    <button class="key" data-num="5">5</button>
    <button class="key" data-num="6">6</button>
    <button class="key op" data-op="-" aria-label="minus">−</button>

    <button class="key" data-num="1">1</button>
    <button class="key" data-num="2">2</button>
    <button class="key" data-num="3">3</button>
    <button class="key op" data-op="+" aria-label="plus">+</button>

    <button class="key" data-num="0">0</button>
    <button class="key" data-act="dot">.</button>
    <button class="key" data-act="back" aria-label="backspace">⌫</button>
    <button class="key acc" data-act="equals">=</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
